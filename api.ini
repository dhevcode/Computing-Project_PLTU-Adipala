; ==============================================================================
; KONFIGURASI API BACKEND MONITORING MAGANG PLTU ADIPALA
; File ini menghubungkan aplikasi Mobile (Android/iOS/Flutter) dengan Backend Web Laravel
; agar keduanya menggunakan SATU DATABASE yang sama secara real-time.
; ==============================================================================

[app]
name = "Monitoring Magang PLTU Adipala"
environment = "development"
version = "1.0.0"

[server]
; Base URL endpoint API untuk aplikasi Mobile
; - Emulator Android Studio : http://10.0.2.2:8000/api
; - HP Asli (Real Device)    : Gunakan IP LAN laptop Anda (cth: http://192.168.1.15:8000/api)
; - Localhost Web / Postman  : http://localhost:8000/api atau http://127.0.0.1:8000/api
base_url_local = "http://127.0.0.1:8000/api"
base_url_emulator = "http://10.0.2.2:8000/api"
base_url_lan = "http://192.168.1.10:8000/api"
base_url_production = "https://monitoring-magang.pltu-adipala.com/api"

[database]
; Database bersama yang dipakai oleh versi Web dan versi Mobile
driver = "mysql"
host = "127.0.0.1"
port = 3307
database = "monitoring_magang"
username = "root"
password = ""

[auth]
type = "Bearer Token (Laravel Sanctum)"
header = "Authorization: Bearer <TOKEN>"
accept_header = "application/json"

[response]
; Semua respons: { "success": bool, "message": string|null, "data": ..., "meta": {...} }
; Daftar ber-halaman: meta = { current_page, last_page, per_page, total } (parameter ?page= & ?per_page=)
; Tanggal "Y-m-d", waktu ISO-8601 dengan offset WIB (contoh 2026-11-06T07:45:00+07:00)
; Error validasi: HTTP 422 { message, errors: { field: [pesan] } }

[endpoints_auth]
; login: field "email" berisi email atau NIM/username; user.role_key = peserta|admin|superadmin|pembimbing
login = "/login"
logout = "/logout"
user_profile = "/user"

[endpoints_peserta]
; Hanya untuk role Peserta/Mahasiswa. Nama field form sama dengan form web peserta.
dashboard = "/peserta/dashboard"
referensi = "/peserta/referensi"
absensi_today = "/peserta/absensi/today"
absensi_checkin = "/peserta/absensi/check-in"
absensi_checkout = "/peserta/absensi/check-out"
absensi_history = "/peserta/absensi/history"
absensi_koreksi_list = "/peserta/absensi/koreksi (GET)"
absensi_koreksi = "/peserta/absensi/koreksi (POST)"
logbook_list = "/peserta/logbook"
logbook_preset = "/peserta/logbook/preset?date=Y-m-d"
logbook_store = "/peserta/logbook/store"
logbook_detail = "/peserta/logbook/{id}"
aduan_list = "/peserta/aduan"
aduan_store = "/peserta/aduan/store"
aduan_detail = "/peserta/aduan/{id}"
aduan_reply = "/peserta/aduan/{id}/reply"
cuti_list = "/peserta/cuti"
cuti_store = "/peserta/cuti/store"
cuti_cancel = "/peserta/cuti/{id}/cancel"
nilai_list = "/peserta/nilai"
informasi = "/peserta/informasi"
notifikasi_list = "/peserta/notifikasi"
notifikasi_read = "/peserta/notifikasi/{id}/read"
notifikasi_read_all = "/peserta/notifikasi/read-all"
profil_get = "/peserta/profil"
profil_update = "/peserta/profil/update"


[endpoints_pembimbing]
; Hanya untuk role Pembimbing / Pembimbing Lapangan; data terbatas pada mahasiswa bimbingannya sendiri.
dashboard = "/pembimbing/dashboard"
referensi = "/pembimbing/referensi"
mahasiswa_list = "/pembimbing/mahasiswa"
mahasiswa_detail = "/pembimbing/mahasiswa/{id}"
absensi_list = "/pembimbing/absensi?date=&status=&mahasiswa_id="
koreksi_list = "/pembimbing/absensi/koreksi?status="
koreksi_review = "/pembimbing/absensi/koreksi/{id}/review (status: approved|rejected, review_note)"
logbook_list = "/pembimbing/logbook?status=&date=&mahasiswa_id=&search="
logbook_detail = "/pembimbing/logbook/{id}"
logbook_review = "/pembimbing/logbook/{id}/review (status: approved|revision_required|rejected, review_note, comment)"
cuti_list = "/pembimbing/cuti?status=&leave_type=&mahasiswa_id="
cuti_review = "/pembimbing/cuti/{id}/review (status: approved|rejected, review_note)"
aduan_list = "/pembimbing/aduan?status=&category=&priority="
aduan_detail = "/pembimbing/aduan/{id}"
aduan_reply = "/pembimbing/aduan/{id}/reply (message, status, is_internal_note)"
nilai_list = "/pembimbing/nilai?mahasiswa_id=&status="
nilai_store = "/pembimbing/nilai/store (mahasiswa_id, evaluation_date, scores{criterion_id:nilai}, participant_note, internal_note, action_type: draft|publish)"
profil_get = "/pembimbing/profil"
profil_update = "/pembimbing/profil/update (nama_lengkap, email, phone, old_password, password, password_confirmation)"

[endpoints_admin]
; Hanya untuk role Admin. Monitoring (absensi/logbook/cuti/aduan/nilai) sama dengan pembimbing tetapi mencakup seluruh mahasiswa.
; Upload berkas memakai multipart/form-data. Surat balasan disimpan di disk public → jalankan "php artisan storage:link".
dashboard = "/admin/dashboard (filter sama dengan data mahasiswa)"
referensi = "/admin/referensi"
mahasiswa_list = "/admin/mahasiswa?search=&jurusan_id=&universitas_id=&divisi_id=&jenis_kelamin=&status=&tahun=&sort=terbaru|terlama|nama_asc|nama_desc|mulai_asc|mulai_desc|selesai_asc|selesai_desc"
mahasiswa_store = "/admin/mahasiswa (POST; universitas_id/jurusan_id/divisi_id boleh 'new' + nama_*_baru; surat_permohonan, proposal, cv)"
mahasiswa_detail = "/admin/mahasiswa/{id_pengajuan}"
mahasiswa_update = "/admin/mahasiswa/{id_pengajuan}/update (POST multipart)"
mahasiswa_delete = "/admin/mahasiswa/{id_pengajuan} (DELETE)"
pengajuan_terima = "/admin/pengajuan/{id}/terima (pembimbing_id, divisi_id, tanggal_mulai, tanggal_selesai, catatan_admin)"
pengajuan_tolak = "/admin/pengajuan/{id}/tolak (alasan_penolakan)"
dokumen_list = "/admin/dokumen?status_verifikasi=verified|not_verified"
dokumen_upload = "/admin/dokumen/{id_pengajuan}/upload (surat_balasan: PDF maks 4MB; dikirim ke email mahasiswa)"
sertifikat_list = "/admin/sertifikat?search=&jurusan=&universitas=&divisi=&jenis_kelamin= (mahasiswa yang sudah selesai magang)"
sertifikat_laporan = "/admin/sertifikat/{id_mhs}/laporan (laporan: PDF maks 10MB)"
sertifikat_verify_id_card = "/admin/sertifikat/{id_mhs}/verify-id-card"
sertifikat_upload = "/admin/sertifikat/{id_mhs}/upload (certificate: pdf/jpg/png maks 5MB)"
absensi_list = "/admin/absensi?date=&status=&mahasiswa_id=&search="
koreksi_list = "/admin/absensi/koreksi?status=&search="
koreksi_review = "/admin/absensi/koreksi/{id}/review (status, review_note)"
logbook_list = "/admin/logbook?status=&date=&mahasiswa_id=&search="
logbook_detail = "/admin/logbook/{id}"
logbook_review = "/admin/logbook/{id}/review (status, review_note, comment)"
cuti_list = "/admin/cuti?status=&leave_type=&mahasiswa_id=&search="
cuti_review = "/admin/cuti/{id}/review (status, review_note)"
aduan_list = "/admin/aduan?status=&category=&priority=&search="
aduan_detail = "/admin/aduan/{id}"
aduan_reply = "/admin/aduan/{id}/reply (message, status, is_internal_note)"
nilai_list = "/admin/nilai?mahasiswa_id=&status="
nilai_store = "/admin/nilai/store (sama dengan pembimbing)"
pengumuman_list = "/admin/pengumuman (meta.company & meta.policy)"
pengumuman_store = "/admin/pengumuman/store (title, category: general|work_rule|safety|announcement|contact|document, content, attachment)"
pengumuman_delete = "/admin/pengumuman/{id} (DELETE)"
company_update = "/admin/pengumuman/company (name, industry, address, latitude, longitude, attendance_radius_meters, work_start_time, work_end_time, phone, email, website, description)"
chatbot_list = "/admin/chatbot?search=&role_access=&status=active|inactive (meta statistik)"
chatbot_store = "/admin/chatbot (POST: kode, pertanyaan, jawaban, kategori, role_access: all|guest|student, urutan, is_active)"
chatbot_update = "/admin/chatbot/{id} (PUT)"
chatbot_delete = "/admin/chatbot/{id} (DELETE)"
chatbot_toggle = "/admin/chatbot/{id}/toggle"
chatbot_logs = "/admin/chatbot/logs?search=&user_type="
chatbot_clear_logs = "/admin/chatbot/clear-logs"
profil_get = "/admin/profil"
profil_update = "/admin/profil/update (nama_lengkap, email)"
profil_password = "/admin/profil/password (current_password, password min 8, password_confirmation)"

[endpoints_superadmin]
; Hanya untuk role Super Admin.
dashboard = "/superadmin/dashboard?role=&q= (daftar akun + meta statistik)"
referensi = "/superadmin/referensi"
akun_store = "/superadmin/akun (POST: nama_lengkap, username, email, password, role, id_divisi|'new' + nama_divisi_baru, id_mhs, is_active)"
akun_detail = "/superadmin/akun/{id}"
akun_update = "/superadmin/akun/{id} (PUT; password kosong = tidak diubah; is_active 0|1)"
akun_delete = "/superadmin/akun/{id} (DELETE)"
pembimbing = "/superadmin/pembimbing"
peserta_list = "/superadmin/peserta?divisi_id=&status=&status_akun=ada_akun|belum_akun&q="
peserta_store = "/superadmin/peserta (POST multipart; buat_akun=1 + password_akun opsional, default mhs123)"
peserta_detail = "/superadmin/peserta/{id_mhs}"
peserta_update = "/superadmin/peserta/{id_mhs}/update (POST multipart; status: Akan Magang|Sedang Magang|Selesai Magang)"
peserta_delete = "/superadmin/peserta/{id_mhs} (DELETE; akun portal ikut terhapus)"
peserta_buat_akun = "/superadmin/peserta/{id_mhs}/buat-akun (password opsional)"
peserta_reset_password = "/superadmin/peserta/{id_mhs}/reset-password (new_password opsional, default mhs123)"
profil_get = "/superadmin/profil"
profil_update = "/superadmin/profil/update (nama_lengkap, username, email, current_password, password, password_confirmation)"

[endpoints_chatbot]
; Publik; kirim token (opsional) agar peserta mendapat FAQ khusus peserta
questions = "/chatbot/questions"
answer = "/chatbot/answer (faq_id)"
